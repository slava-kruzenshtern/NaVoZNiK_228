<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загадка №5</title>

<link rel="stylesheet" href="./style.css">

</head>



<body class="page-5">
<main class="wrap">
  
  <div class="prompt-2">
    ЗАГАДКА №5
  </div>

<div class="line"></div>

<div class="citata">
    «Один победитель, сорок два лузера»
</div>
<div class="autor">
    — Молния Маккуин
</div>

<div class="line"></div>

<div class="text-box">
     <span style="color:#aaa;font-size:21px; font-weight: 700;letter-spacing:2px">ВСЕ ПРОСТО!</span><br>
    Для детей от 3-х лет!<br>
</div>

  <form id="gate">
    <div class="fields">
      <label class="field"><span class="num">05</span>
        <input id="p5" type="password" autocomplete="off" spellcheck="false" placeholder="KEY_05"></label>
    </div>
    <button type="submit">ПРОВЕРКА НА ДОЛБОЕБА</button>
  </form>

  <div id="status"></div>

<div class="puzzle-image"> 
      <img src="./images/navoznik 1.png"></div>

  <div class="small">by "ЛИСЫ да ПЕСЫ"</div>

</main>



<script>
// ============================================
// CHANGE THE FIVE PASSWORDS HERE
// ============================================
const KEYS = [
  "ВАЗАП МАБОЙ"
];

const form = document.getElementById("gate");
const status = document.getElementById("status");

form.addEventListener("submit", function(e){
  e.preventDefault();

  const entered = [5].map(n =>
    document.getElementById("p"+n).value.trim().toUpperCase()
  );

  const correct = entered.every((value, i) => value === KEYS[i]);

  if(correct){
    status.className = "success";
    status.textContent = "КЧАУ !!!";
    setTimeout(() => {
      window.location.href = "the-end.html";
    }, 1000);
  } else {
    status.className = "error";
    status.textContent = "АХАХАХАХА ДОЛБОЕБ !!!";
    form.animate(
      [{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],
      {duration:180}
    );
  }
});
</script>
</body>
</html>
