<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загадка №4</title>

<link rel="stylesheet" href="./style.css">

</head>



<body class="page-4">
<main class="wrap">
  
  <div class="prompt-2">
    ЗАГАДКА №4
  </div>

<div class="line"></div>

<div class="citata">
    «The end is where we start from»
</div>
<div class="autor">
    — T.S. Eliot, «Little Gidding», 1942
</div>

<div class="line"></div>

<div class="text-box">
    y=3(x+#)  {-# ≤ x ≤ -#}
</div>
<div class="text-box">
    y=x  {# ≤ x ≤ #}
</div>
<div class="text-box">
    y=-#  {-# ≤ x ≤ -#}
</div>
<div class="text-box">
    r=a-bθ  {-# ≤ θ ≤ #}
</div>


<script>
document.querySelectorAll(".text-box").forEach(block => {
    block.innerHTML = block.innerHTML.replace(/#/g, '<span class="highlight">?</span>');
});
</script>


<div class="prompt-1">
    НАЙДИ НЕИЗВЕСТНОЕ.<br>
    УЗРИ <span style="color:#67b343;">СОКРЫТОЕ.</span>
</div>

<div class="lineyka">
  <a href="https://www.desmos.com/calculator/s60mqvyp85?lang=ru" target="_blank">
  <img src="./images/lineyka.png"></a></div>

  <form id="gate">
    <div class="fields">
      <label class="field"><span class="num">04</span>
        <input id="p4" type="password" autocomplete="off" spellcheck="false" placeholder="KEY_04"></label>
    </div>
    <button type="submit">ПРОВЕРКА НА ДОЛБОЕБА</button>
  </form>

  <div id="status"></div>

<div class="puzzle-image"> 
      <img src="./images/navoznik 1.png"></div>

  <div class="small">by "ЛИСЫ да ПЕСЫ"</div>

</main>



<script>
// ============================================
// CHANGE THE FIVE PASSWORDS HERE
// ============================================
const KEYS = [
  "КОНОХА"
];

const form = document.getElementById("gate");
const status = document.getElementById("status");

form.addEventListener("submit", function(e){
  e.preventDefault();

  const entered = [4].map(n =>
    document.getElementById("p"+n).value.trim().toUpperCase()
  );

  const correct = entered.every((value, i) => value === KEYS[i]);

  if(correct){
    status.className = "success";
    status.textContent = "ДА ТЫ ЗАЕБАЛ !!!";
    setTimeout(() => {
      window.location.href = "page-5.html";
    }, 1000);
  } else {
    status.className = "error";
    status.textContent = "АХАХАХАХА ДОЛБОЕБ !!!";
    form.animate(
      [{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],
      {duration:180}
    );
  }
});
</script>
</body>
</html>
